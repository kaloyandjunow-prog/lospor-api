name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match the major version the appliance actually runs. The 37
        # *-postgres.test.ts assertions gated behind LOSPOR_POSTGRES_INTEGRATION
        # cover case locking, audit atomicity, conflict override and clinical
        # serialization -- locking and transaction visibility are exactly what
        # can differ across a major version, so proving them on 16 while
        # shipping 17 tested the wrong database. Bookworm rather than Alpine
        # keeps the libc and collation family aligned with production too,
        # matching lospor-hospital's own CI service.
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      LOSPOR_AUTH_SECRET: ci-only-not-used-for-production
      LOSPOR_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run openapi:generate
      - run: git diff --exit-code -- src/generated/openapi.json src/generated/openapi-internal.json
      - run: npm run verify:boundaries
      - run: npx tsc --noEmit --pretty false
      - run: npm run lint
      - run: npm test
        env:
          LOSPOR_POSTGRES_INTEGRATION: "true"
      - run: npm run build
      # Advisory only, deliberately. Nothing upstream of the appliance audited
      # its own dependencies: lospor-hospital gates `npm audit`, but it audits
      # its own seven packages, so an advisory reaching a vendored app stayed
      # invisible until someone looked by hand. A scan today reports a
      # high-severity production advisory here (nanoid <3.3.18, reached through
      # next -> postcss), which no gate would have surfaced.
      #
      # It does not fail the build yet: the fix means rewriting a lockfile, and
      # that is a deliberate change rather than something to force on whoever
      # pushes next. Turn this blocking once the current findings are cleared.
      - name: Dependency advisories (advisory, non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
